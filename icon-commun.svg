<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="#3f6b56"/>

    <!-- back envelope, offset -->
    <g transform="translate(-26,18)">
      <rect x="96" y="196" width="320" height="220" rx="10" fill="#c9d9cf"/>
      <polygon points="96,196 416,196 256,338" fill="#b3c7ba"/>
    </g>

    <!-- front envelope -->
    <g transform="translate(26,-10)">
      <rect x="96" y="196" width="320" height="220" rx="10" fill="#f7f2e7"/>
      <polygon points="96,196 416,196 256,338" fill="#e8dcc8"/>
      <line x1="96" y1="196" x2="256" y2="338" stroke="#23324d" stroke-width="4" stroke-opacity="0.10"/>
      <line x1="416" y1="196" x2="256" y2="338" stroke="#23324d" stroke-width="4" stroke-opacity="0.10"/>
    </g>

    <!-- joint seal: two interlocking rings -->
    <g transform="translate(256,300)">
      <circle cx="-14" cy="0" r="26" fill="none" stroke="#b8923d" stroke-width="9"/>
      <circle cx="14" cy="0" r="26" fill="none" stroke="#f7f2e7" stroke-width="9"/>
    </g>

    <!-- gold top accent -->
    <rect x="0" y="0" width="512" height="14" fill="#b8923d"/>
  </g>
</svg>
